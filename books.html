<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Books by Gale Largey | Official Website</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="Books by Gale P. Largey, documenting the people, places, and history of Wellsboro and north-central Pennsylvania.">

<meta name="author" content="Gale P. Largey">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap"
      rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap"
      rel="stylesheet">

<style>

/* ===== HISTORIC PARCHMENT ===== */

html {
    background-color: #EADCC5;
    background-image:
        radial-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
        radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1px);
    background-size: 4px 4px, 7px 7px;
}

/* ===== BASE ===== */

body {
    margin: 0;
    min-height: 100vh;
    box-sizing: border-box;

    font-family: Georgia, "Times New Roman", serif;
    color: #26221c;

    text-align: center;
    line-height: 1.9;

    padding: clamp(60px, 10vh, 120px) 20px 40px;
}

.page {
    max-width: 900px;
    min-height: calc(100vh - 160px);

    margin: 0 auto;

    display: flex;
    flex-direction: column;
}

/* ===== BOOK CONTENT ===== */

/*
   Book content will be added here.
*/

.book-content {
    flex: 1;
}

/* ===== FOOTER ===== */

.footer {
    margin-top: 4.5em;

    font-size: 1rem;
    color: #5f564a;
}

/* ===== LAST MODIFIED ===== */

.last-modified {
    margin-top: .6em;

    font-style: italic;
    font-size: .95rem;
    color: #6a6257;
}

</style>
</head>

<body>

<div class="page">

    <!-- ===== BOOK CONTENT ===== -->

    <main class="book-content">

        <!-- Book information will go here. -->

    </main>


    <!-- ===== FOOTER ===== -->

    <footer>

        <div class="footer">
            galelargey.org &nbsp;&nbsp;|&nbsp;&nbsp; © 2026
        </div>

        <div class="last-modified" id="lastModified"></div>

    </footer>

</div>


<script>

const lastModified = new Date(document.lastModified);

const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York',
    month: 'short',
    day: '2-digit',
    year: 'numeric',
    hour: 'numeric',
    minute: '2-digit',
    hour12: true,
    timeZoneName: 'short'
}).formatToParts(lastModified);

const values = {};

parts.forEach(part => {
    values[part.type] = part.value;
});

const formatted =
    `${values.month} ${values.day}, ${values.year} — ` +
    `${values.hour}:${values.minute} ` +
    `${values.dayPeriod} ${values.timeZoneName}`;

document.getElementById("lastModified").textContent =
    "Last update: " + formatted;

</script>

</body>
</html>
